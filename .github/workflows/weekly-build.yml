name: Weekly station schedules

on:
  schedule:
    # Tuesday 08:00 UTC, after Monday night, when the next NFL week is the one to publish.
    - cron: "0 8 * * 2"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-listings
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: chanel-finder/requirements.txt

      - name: Install Python tools
        working-directory: chanel-finder
        run: pip install -r requirements.txt

      - name: Restore the listing cache
        uses: actions/cache@v4
        with:
          path: chanel-finder/cache/listings
          key: station-listings-${{ github.run_id }}
          restore-keys: station-listings-

      - name: Build station schedules
        working-directory: chanel-finder
        run: python build_listings.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the site
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Commit the published site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html favicon.svg places.txt .nojekyll assets data web/public/data/listings.json
          if git diff --cached --quiet; then
            echo "Nothing new to publish."
            exit 0
          fi
          git commit -m "Publish station schedules for the current NFL week"
          git push
