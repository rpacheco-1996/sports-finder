name: Build and deploy

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Build and publish the site
        run: |
          npm ci
          npm run build

      - name: Commit the published site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            index.html \
            assets \
            listings \
            places.txt \
            data/markets.json \
            sitemap.xml \
            robots.txt \
            logo.png \
            favicon.ico \
            CNAME \
            .nojekyll \
            public/listings \
            public/sitemap.xml \
            public/robots.txt \
            public/CNAME

          if git diff --cached --quiet; then
            echo "Nothing new to publish."
            exit 0
          fi

          git commit -m "Build and deploy site"
          git push