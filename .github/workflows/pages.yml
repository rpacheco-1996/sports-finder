name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Wednesday and Saturday afternoon UTC, after weekly NFL maps are usually posted.
    - cron: "0 15 * * 3,6"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        id: pages
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: chanel-finder/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Python dependencies
        run: pip install -r chanel-finder/requirements.txt
      - name: Export coverage maps
        continue-on-error: true
        run: python chanel-finder/export_web.py --out web/public/data
      - name: Build site
        working-directory: web
        env:
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/
        run: npm ci && npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
